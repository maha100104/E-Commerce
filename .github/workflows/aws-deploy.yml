name: Deploy to AWS ECS

on:
  push:
    branches:
      - aws_deployment
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_BACKEND: ecommerce-backend
  ECR_REPOSITORY_FRONTEND: ecommerce-frontend
  ECS_SERVICE_BACKEND: ecommerce-backend-task-service-zml2q6me
  ECS_SERVICE_FRONTEND: ecommerce-frontend-task-service-wolq9505
  ECS_CLUSTER: ecommerce-cluster
  ECS_TASK_DEFINITION_BACKEND: aws/ecs-backend-task.json
  ECS_TASK_DEFINITION_FRONTEND: aws/ecs-frontend-task.json

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::835597620569:role/GitHubActions-ECommerce-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY_BACKEND --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name $ECR_REPOSITORY_BACKEND --region ${{ env.AWS_REGION }}
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY_FRONTEND --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name $ECR_REPOSITORY_FRONTEND --region ${{ env.AWS_REGION }}

      # --- BACKEND BUILD & PUSH ---
      - name: Build, tag, and push Backend image to Amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- FRONTEND BUILD & PUSH ---
      - name: Build, tag, and push Frontend image to Amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=http://ecommerce-backend-alb-579415662.ap-south-1.elb.amazonaws.com \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # --- RENDER ECS TASK DEFINITIONS ---
      - name: Render Backend Task Definition
        id: render-backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_BACKEND }}
          container-name: ecommerce-backend
          image: ${{ steps.build-backend-image.outputs.image }}

      - name: Render Frontend Task Definition
        id: render-frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FRONTEND }}
          container-name: ecommerce-frontend
          image: ${{ steps.build-frontend-image.outputs.image }}

      # --- DEPLOY TO AWS ECS ---
      - name: Deploy Backend to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Frontend to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
